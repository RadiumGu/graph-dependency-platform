# 边验证实验：证伪打进 `pethistory` 的 1 条 Calls 边
#
# 生成 2026-08-31。这是 T-214 拿到首条判定（petsite/petlistadoptions -> petsearch
# 双 confirmed）之后，按同一模式覆盖剩余「有流量且可注入」的边。
#
# 命名核对（2026-08-31 实测）：Pod 标签是 `app=pethistory`，**不是**
# pethistory-deployment —— 后者是 Deployment 名，也是 service_mappings.json 里
# neptune_to_k8s 的取值。两者不是一回事，写错会让 preflight 报「无 Running Pods」。
# 本服务三套命名恰好一致（kubectl / DeepFlow / 图谱都是 pethistory）。
# pethistory 只有 1 个副本 —— 注入即全量，没有健康副本兜底，
# 所以 observer 护栏阈值比其他两个实验更保守。
#
# 三角色标注：
#   Injection Target   = pethistory（图谱规范名同为 pethistory）
#   Observation Target = petsite
# 一条边天然就是「在 X 注入，预期在 Y 观测到影响」的断言。
#
# 用法：
#   cd chaos/code && python3.11 main.py run --file experiments/tier1/verify-edges-into-pethistory.yaml
#
# 前置：kubectl 在 PATH 且 KUBECONFIG 指向 PetSite 集群。

name: verify-edges-into-pethistory
description: "在 pethistory 注入 HTTP abort，观测 petsite 是否退化，以证伪 1 条 Calls 边"
backend: chaosmesh

target:
  service: pethistory
  namespace: petadoptions
  tier: Tier1

  observers:
    - service: petsite
      namespace: petadoptions
      edge_label: Calls
      # petsite 详情页拉取历史
      min_baseline_requests: 20

fault:
  # abort 而非 delay：直接短路连接，可绕过部分缓存掩盖。
  # delay 会被缓存与连接池吸收，容易把真实依赖判成不存在（假阴性）。
  type: http_chaos
  mode: all
  value: ""
  duration: "3m"          # 需超过熔断窗口 + 重试预算耗尽才能穿透 fallback
  action: abort
  port: 8080

steady_state:
  before:
    # 针对**注入目标**。观测方基线由 runner 单独采集，不足只记警告。
    - metric: success_rate
      threshold: ">= 95%"
      window: "1m"
  after:
    - metric: success_rate
      threshold: ">= 90%"
      window: "3m"

stop_conditions:
  # 护栏必须挂**观测方**（T-214b）：全量 abort 下注入目标成功率必然归零，
  # 那是处理本身不是护栏信号。要防的是附带损害。
  # 阈值刻意低于 confirm 判定线 20pp —— 目标是让边被判 confirmed，
  # 而不是一有退化就熔断（那只会得到 inconclusive）。
  - metric: success_rate
    threshold: "< 25%"
    window: "60s"
    action: abort
    target: any_observer

rca:
  enabled: false           # 边验证只取边的证据，不叠加 RCA 变量

graph_feedback:
  enabled: true
  edges:
    - Calls

options:
  max_duration: "8m"

# ── 爆炸半径 ────────────────────────────────────────────────────────────────
# 集群为**非生产** PetSite demo，流量来自 EC2 负载机 i-05f0b897988a48d17。
# 已知固有代价：abort 会打断 liveness 探针 -> 容器重启 -> tproxy 残留在 Pod
# netns（属 sandbox 不属容器）-> 重启清不掉，实验结束后需删 Pod 重建。
# Phase 5 的 Pod readiness + 重启差值判据（T-214h）会把这件事判成 FAILED
# 并在报告里给出处置命令，不再报假 PASSED。
