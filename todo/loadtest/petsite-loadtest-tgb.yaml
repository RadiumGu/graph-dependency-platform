# 压测用 internal ALB 的 TargetGroupBinding
#
# 作用:把 petadoptions/service-petsite 的 Pod IP 同时注册到压测专用目标组 petsite-lt-tg,
#      从而让 internal ALB(petsite-internal-lt)也能转发到同一批 Pod。
#
# 与现有 petsite-tgb 的关系:并存、互不影响。一个 Service 可被多个 TargetGroupBinding 引用,
#      现有 petsite-tgb -> Servic-PetSi-7JEWC19HNKSR(挂在 internet-facing ALB)保持原样。
#
# 刻意 **不** 带 CDK 的 prune label(aws.cdk.eks/prune-...):
#      现有 petsite-tgb 带该 label,是 CDK 管的;本资源为手工添加,带上会被下次 CDK 部署清掉。
#
# 撤销:kubectl delete -f 本文件  (随后可删 ALB / TG / SG,见文件末尾)
apiVersion: elbv2.k8s.aws/v1beta1
kind: TargetGroupBinding
metadata:
  name: petsite-loadtest-tgb
  namespace: petadoptions
  labels:
    purpose: loadtest
spec:
  serviceRef:
    name: service-petsite
    port: 80          # Service 端口;targetPort=8080 由 controller 解析到 Pod
  targetGroupARN: arn:aws:elasticloadbalancing:ap-northeast-1:926093770964:targetgroup/petsite-lt-tg/1fcdf49552117d4c
  targetType: ip
  ipAddressType: ipv4

# ── 完整拆除顺序(需要时) ──────────────────────────────────────────────
# kubectl delete -f petsite-loadtest-tgb.yaml
# aws elbv2 delete-load-balancer --load-balancer-arn arn:aws:elasticloadbalancing:ap-northeast-1:926093770964:loadbalancer/app/petsite-internal-lt/b651f61f074cbbfe
# aws elbv2 delete-target-group  --target-group-arn  arn:aws:elasticloadbalancing:ap-northeast-1:926093770964:targetgroup/petsite-lt-tg/1fcdf49552117d4c
