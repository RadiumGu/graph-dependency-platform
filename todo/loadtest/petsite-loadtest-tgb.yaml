# 压测 / 跨 VPC 流量生成用的内网入口 —— TargetGroupBinding 清单
#
# 目的:让 agent-vpc-v2 (10.1.0.0/16) 里的负载生成器经 VPC 对等 + 内网 ALB 访问
#      PetSite,全程不出公网。
#
# 内网 ALB : petsite-internal-lt
#            internal-petsite-internal-lt-1660792065.ap-northeast-1.elb.amazonaws.com
#   :80    -> petsite-lt-tg        -> service-petsite:80   (Pod targetPort 8080)
#   :8081  -> petsite-lt-search-tg -> search-service:80    (Pod targetPort 80)
#
# 与现有 CDK 管理的 petsite-tgb / pethistory-tgb 并存,互不影响:
#   一个 Service 可被多个 TargetGroupBinding 引用。
#
# 刻意 **不** 带 CDK 的 prune label(aws.cdk.eks/prune-...):
#   现有 petsite-tgb 带该 label 由 CDK 管理;本文件是手工添加的,
#   带上会被下一次 CDK 部署清掉。
---
apiVersion: elbv2.k8s.aws/v1beta1
kind: TargetGroupBinding
metadata:
  name: petsite-loadtest-tgb
  namespace: petadoptions
  labels:
    purpose: loadtest
spec:
  serviceRef:
    name: service-petsite
    port: 80              # Service 端口;targetPort=8080 由 controller 解析到 Pod
  targetGroupARN: arn:aws:elasticloadbalancing:ap-northeast-1:926093770964:targetgroup/petsite-lt-tg/1fcdf49552117d4c
  targetType: ip
  ipAddressType: ipv4
---
apiVersion: elbv2.k8s.aws/v1beta1
kind: TargetGroupBinding
metadata:
  name: search-loadtest-tgb
  namespace: petadoptions
  labels:
    purpose: loadtest
spec:
  serviceRef:
    name: search-service
    port: 80              # Service 与 targetPort 同为 80
  targetGroupARN: arn:aws:elasticloadbalancing:ap-northeast-1:926093770964:targetgroup/petsite-lt-search-tg/202a33d64d7e4a08
  targetType: ip
  ipAddressType: ipv4

