#   --ip-permissions 'IpProtocol=tcp,FromPort=8080,ToPort=8080,UserIdGroupPairs=[{GroupId=sg-06d40c8bcd96d347d}]'
# aws ec2 delete-security-group --group-id sg-06d40c8bcd96d347d
