# AWS Resilience Hub EKS RBAC — 官方模板(全命名空间只读)
# 来源: https://docs.aws.amazon.com/resilience-hub/latest/userguide/grant-permissions-to-eks-in-arh.html
# 名称与 ARH v2 评估失败信息中要求的完全一致:
#   resilience-hub-eks-access-cluster-role / -binding / group resilience-hub-eks-access-group
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: resilience-hub-eks-access-cluster-role
rules:
- apiGroups:
    - ""
  resources:
    - pods
    - replicationcontrollers
    - nodes
  verbs:
    - get
    - list
- apiGroups:
    - apps
  resources:
    - deployments
    - replicasets
  verbs:
    - get
    - list
- apiGroups:
    - policy
  resources:
    - poddisruptionbudgets
  verbs:
    - get
    - list
- apiGroups:
    - autoscaling.k8s.io
  resources:
    - verticalpodautoscalers
  verbs:
    - get
    - list
- apiGroups:
    - autoscaling
  resources:
    - horizontalpodautoscalers
  verbs:
    - get
    - list
- apiGroups:
    - karpenter.sh
  resources:
    - provisioners
    - nodepools
  verbs:
    - get
    - list
- apiGroups:
    - karpenter.k8s.aws
  resources:
    - awsnodetemplates
    - ec2nodeclasses
  verbs:
    - get
    - list
# ---- 以下为 2026-08-29 追加(官方 v1 模板之外) ----
# 原因:官方 YAML 是 v1 模板,next-gen 的「资源发现」步骤报
#   "Resource discovery could not access the Kubernetes API for this cluster"
# 而该模板既无 namespaces(枚举命名空间)也无 services/endpoints(把 pod 映射到网络出口),
# 也不含 statefulsets/daemonsets/jobs。AWS 未为 next-gen 单独发布 EKS 权限文档,
# 故按只读最小必要原则补齐常见发现所需类型。全部仅 get/list/watch 中的 get+list,无写权限。
- apiGroups:
    - ""
  resources:
    - namespaces
    - services
    - endpoints
    - configmaps
    - persistentvolumeclaims
  verbs:
    - get
    - list
- apiGroups:
    - apps
  resources:
    - statefulsets
    - daemonsets
  verbs:
    - get
    - list
- apiGroups:
    - batch
  resources:
    - jobs
    - cronjobs
  verbs:
    - get
    - list
- apiGroups:
    - discovery.k8s.io
  resources:
    - endpointslices
  verbs:
    - get
    - list
- apiGroups:
    - networking.k8s.io
  resources:
    - ingresses
    - networkpolicies
  verbs:
    - get
    - list
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: resilience-hub-eks-access-cluster-role-binding
subjects:
  - kind: Group
    name: resilience-hub-eks-access-group
    apiGroup: rbac.authorization.k8s.io
roleRef:
  kind: ClusterRole
  name: resilience-hub-eks-access-cluster-role
  apiGroup: rbac.authorization.k8s.io
