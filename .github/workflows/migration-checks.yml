name: migration-checks

# Strands 迁移 CI 关卡 (Phase 1 启用占位，Phase 3 起才有实际阻断作用)
#   - check-deadlines: 对 docs/migration/timeline.md 里过了 delete_date 的 direct_file
#     在仓库中仍存在时阻断 CI
#   - check-frozen:    阻止 PR 修改 🔒 FROZEN 标记文件（除非带 P0-bugfix label）
#   - offline-tests:   离线子集 + 通过数下限（2026-09-21 加，见该 job 的注释）
#
# ⚠️ 这个 CI **不是**测试套件的守护者，别把它绿了当成安全。
# 全量 1101 个测试里离线只能跑 26 个（2.4%）—— 剩下 987 个需要真实
# AWS 凭据与 VPC 内的 Neptune，GitHub 托管 runner 两个都没有。
# 真正的行为守护（含 golden / 活图谱核验）必须在 VPC 内有凭据的机器上跑。

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  check-deadlines:
    name: Migration deadline check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install PyYAML
        run: pip install pyyaml
      - name: Run check_migration_deadlines.py
        run: python3 scripts/check_migration_deadlines.py

  offline-tests:
    name: Offline test subset (with pass-count floor)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test deps
        # ⚠️ 2026-09-24：补上 pydantic。
        #
        # 在此之前这个 job **从来没有真正跑过测试**：tests/conftest.py 会
        # 导入 rca/config.py → profiles/profile_loader.py → profiles/schema.py，
        # 而那里 `from pydantic import BaseModel` —— 依赖没装，pytest 在收集
        # 阶段就以 exit code 4 挂掉：
        #
        #   ImportError while loading conftest '.../tests/conftest.py'
        #   E  ModuleNotFoundError: No module named 'pydantic'
        #
        # 后果比「一个检查是红的」更糟：**pass-count 下限从未生效过**。
        # 通过数恒为 0，而下面那行注释说「这一行是这个 job 的全部价值所在」——
        # 那个价值一直是 0。红了这么久没人处置，因为它红的原因看起来
        # 像环境问题而不是代码问题。
        # 这四个是 2026-09-24 逐个从 CI 日志里读出来的，不是猜的：
        #   pydantic    conftest → rca/config → profiles/schema
        #   structlog   tests/test_39 → chaos/code/runner/observability
        #   streamlit   tests/test_22
        #   moto        tests/test_12
        # 补齐之前，这三个文件在**收集阶段**就 ERROR，pytest 直接
        # Interrupted，于是实际通过数 0、下限 24 永远不满足。
        # ⚠️ 2026-09-24：改成装 requirements-dev.txt，不再手列。
          #
          # 手列的代价已经出现两次：此前有人从 CI 日志里逐个追加了
          # pydantic / structlog / streamlit / moto 四个，而 strands-agents
          # 仍然缺着 —— 手列必然漂移，因为它与仓库真正的依赖清单没有任何
          # 机械联系，只能靠人记得同步。
          #
          # requirements-dev.txt 就是这套测试的权威清单（它自己写着
          # 「测试与本地开发依赖」）。换成它之后实测：
          #
          #   手列 8 个包            1041 passed, 5 failed, 41 errors
          #   -r requirements-dev    1069 passed, 1 failed,  0 errors
          #
          # 那 40 个消失的 error 全是 ModuleNotFoundError('strands')。
        run: pip install -q -r requirements-dev.txt
      - name: Run offline subset
        env:
          # `GDP_OFFLINE=1` 只把「确认是云访问不可达」的失败转成 skip
          # （判据是本仓库 9 处签名路径抛的「凭据未解析到」文本 + 连接层错误），
          # **业务断言失败照旧是失败**。见 tests/conftest.py 的详细说明。
          GDP_OFFLINE: "1"
          # ⚠️ 这一行是这个 job 的全部价值所在。
          #
          # 离线模式会把 987 个用云测试 skip 掉，于是「全部 skip」的运行
          # 看起来是绿的 —— 那比没有 CI 更糟，因为它把「测试没跑」
          # 伪装成「测试通过了」。下限校验（passed >= 这个数）是唯一能
          # 挡住这种假绿的东西。
          #
          # 2026-09-21 实测离线通过 26 个，设 24 留一点波动余量。
          # **新增离线可跑的测试后请上调这个数**，否则它会越来越松。
          GDP_OFFLINE_MIN_PASSED: "1040"
        run: python3 -m pytest tests/ -q
      - name: Remind that this is not full coverage
        if: always()
        run: |
          echo "::notice::离线子集只覆盖全量 1101 个测试里的约 26 个（2.4%）。"
          echo "::notice::golden 与活图谱核验需要 AWS 凭据 + VPC 内 Neptune，不在此 job 范围内。"

  check-frozen:
    name: Frozen-file edit guard
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Block edits to frozen files
        shell: bash
        run: |
          set -e
          # Grep 仓库内带 FROZEN 标记的文件；支持 🔒 FROZEN 或 "# FROZEN: <date>"
          frozen=$(git grep -lE "(🔒 ?FROZEN|^# FROZEN:)" -- 'rca/**' 'chaos/**' 'dr-plan-generator/**' 2>/dev/null || true)
          if [ -z "$frozen" ]; then
            echo "No frozen files declared; skip."
            exit 0
          fi
          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.event.pull_request.head.sha }}"
          changed=$(git diff --name-only "$base..$head")
          echo "Frozen files in repo:"
          echo "$frozen" | sed 's/^/  - /'
          echo
          echo "Files changed in this PR:"
          echo "$changed" | sed 's/^/  - /'
          echo
          violations=""
          for f in $frozen; do
            if echo "$changed" | grep -qx "$f"; then
              violations="$violations\n  - $f"
            fi
          done
          if [ -n "$violations" ]; then
            # P0-bugfix label 可豁免
            labels=$(jq -r '.pull_request.labels[].name' "$GITHUB_EVENT_PATH" 2>/dev/null || true)
            if echo "$labels" | grep -qx "P0-bugfix"; then
              echo "Frozen files edited but PR carries 'P0-bugfix' label; allowing."
              exit 0
            fi
            echo -e "❌ The following frozen files must not be edited without 'P0-bugfix' label:$violations"
            exit 1
          fi
          echo "✅ No frozen files touched."
