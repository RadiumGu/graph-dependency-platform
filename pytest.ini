[pytest]
# 本仓库**不是**可安装的 Python 包（是 Lambda 部署目录 + 测试 + demo），
# 故用 pytest.ini 而非 pyproject.toml：加 [project] 表会误示它是包。
#
# 固定 rootdir 与 testpaths，避免从不同子目录调用 pytest 时行为不一致
# —— 测试靠 conftest.py 注入 sys.path，rootdir 漂移会让 import 解析随调用位置变化。

testpaths = tests

# 自定义 mark 必须登记，否则每次运行产生 19 条 PytestUnknownMarkWarning，
# 把真正的警告淹掉。
markers =
    neptune: 需要真实 Neptune 连接的测试（无 NEPTUNE_ENDPOINT 时会 skip）

# 让未登记的 mark 直接报错而不是仅警告 —— 拼错 mark 名（如 @pytest.mark.netune）
# 会导致该测试被静默地当作无标记执行，属于难以发现的失效。
addopts = --strict-markers

# 本仓库有 661 处 py3.10+ 联合类型语法（`list | None` 等）。
# pytest 无法声明 Python 版本下限，故在 tests/paths.py 里做运行时检查并给出
# 明确提示。约束本身写在 requirements-dev.txt 与 README 的测试小节。
minversion = 7.0
