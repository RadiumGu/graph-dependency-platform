# profiles/petsite.yaml — 完整 Environment Profile
# 全平台所有模块的环境特定配置集中在此

# =====================================================
# 1. 基本信息
# =====================================================
profile:
  name: "PetSite"
  description: "AWS Workshop PetSite 微服务架构"
  version: "1.0"

# =====================================================
# 2. 服务注册表（Single Source of Truth）
#    消除 4 个模块中的重复映射
# =====================================================
services:
  petsite:
    tier: Tier0
    k8s_deployment: "petsite-deployment"
    k8s_label: "petsite"
    neptune_name: "petsite"
    cloudwatch:
      namespace: "AWS/ApplicationELB"
      dimension_name: "TargetGroup"
      dimension_value: "service-petsite"
    deepflow_app: "petsite"

  petsearch:
    tier: Tier0
    k8s_deployment: "search-service"
    k8s_label: "search-service"
    neptune_name: "petsearch"
    cloudwatch:
      namespace: "AWS/ApplicationELB"
      dimension_name: "TargetGroup"
      dimension_value: "search-service"
    deepflow_app: "search-service"

  payforadoption:
    tier: Tier0
    k8s_deployment: "pay-for-adoption"
    k8s_label: "pay-for-adoption"
    neptune_name: "payforadoption"
    cloudwatch:
      namespace: "AWS/ApplicationELB"
      dimension_name: "TargetGroup"
      dimension_value: "pay-for-adoption"
    deepflow_app: "pay-for-adoption"

  pethistory:
    tier: Tier1
    k8s_deployment: "pethistory-deployment"
    k8s_label: "pethistory"
    neptune_name: "pethistory"
    aliases:
      - "petadoptionshistory"
      - "pethistory-service"
    cloudwatch:
      namespace: "AWS/ApplicationELB"
      dimension_name: "TargetGroup"
      dimension_value: "pethistory-service"
    deepflow_app: "pethistory-deployment"

  petstatusupdater:
    # 2026-08-28 修正 Tier2 → Tier1。四方核对，本文件原先是唯一的异类：
    #   AWS 资源 tag（statusupdater lambda）  Tier=tier1
    #   infra/lambda/etl_aws/business_config.json  Tier1
    #   活图 Microservice.recovery_priority        Tier1
    #   本文件                                    Tier2  ← 错
    # 由 tests/test_24_live_schema_consistency.py 的一致性校验发现。
    tier: Tier1
    type: lambda
    lambda_name: "petstatusupdater"
    neptune_name: "petstatusupdater"

  petlistadoptions:
    tier: Tier1
    # 曾错误声明为 `type: lambda` + 无 k8s_deployment/k8s_label。
    # 实测（2026-08-29）：账号里**不存在**名为 petlistadoptions 的 Lambda，
    # 它是 EKS 部署 `list-adoptions`（petadoptions 命名空间，2/2，已运行 154 天）。
    #
    # 这个错声明有两个连带后果，都不只是「少一个别名」：
    #   ① etl_deepflow 用 `fb = 'region' if svc_type == 'lambda' else 'az'`
    #      推 fault_boundary，于是这个 EKS 服务的**故障边界被算成 region**
    #      —— 爆炸半径推理直接错。
    #   ② 没有 k8s_deployment/k8s_label 就生成不出 k8s_alias，
    #      DeepFlow 按部署名建了一个独立的 Microservice/list-adoptions 节点，
    #      与本条目是**同一个服务的两个节点** —— 与 EC2 那次「用可变属性
    #      当身份键」是同一类重复实体缺陷。
    type: k8s
    k8s_deployment: "list-adoptions"
    k8s_label: "list-adoptions"
    neptune_name: "petlistadoptions"
    cloudwatch:
      namespace: "AWS/ApplicationELB"
      dimension_name: "TargetGroup"
      dimension_value: "list-adoptions"

# =====================================================
# 3. AWS 资源映射
#    消除 rca/collectors/aws_probers.py 硬编码
# =====================================================
aws_resources:
  primary_region: "ap-northeast-1"

  sqs_queues:
    petsite: ["sqspetadoption", "petadoption"]
    payforadoption: ["sqspetadoption"]

  dynamodb_tables:
    petsite: ["petadoption", "ddbpetadoption"]

  lambda_functions:
    petsite: ["petsite", "statusupdater", "StepFn"]
    payforadoption: ["StepFn", "stepprice"]
    # petadoption 从 rca/collectors/aws_probers.py 与 layer2_tools.py 的
    # SERVICE_FUNCTION_MAP 硬编码副本迁入（2026-08-28 消除副本时保留原行为）。
    # 注意：该名称不在活图的 15 个 Microservice 中，作为 affected_service 永远不会命中，
    # 疑为遗留配置。删除它需要单独的证据支撑，不在本次重构范围内。
    petadoption: ["statusupdater", "StepFn", "stepread", "stepprice"]

  s3_buckets:
    incidents: "petsite-incidents"

# =====================================================
# 4. 应用配置（dr-plan-generator 使用）
# =====================================================
application:
  domain: "petsite.example.com"
  health_endpoint: "/health"
  health_check_command: >
    curl -sf https://{domain}{health_endpoint} | jq '.status'
  alarm_prefix: "petsite"

# =====================================================
# 5. SSM 参数路径
#    消除 step_builder、slack_notifier、action_executor 硬编码
# =====================================================
parameter_store:
  prefix: "/petsite"
  keys:
    dynamodb_region: "/petsite/dynamodb-region"
    slack_interact_url: "/petsite/slack/interact-url"
    rca_rate_limit: "/petsite/rca/rate-limit/{service}"

# =====================================================
# 6. DNS 配置
# =====================================================
dns:
  hosted_zone_id: "${ROUTE53_ZONE_ID}"
  primary_record: "petsite.example.com"
  ttl_normal: 300
  ttl_pre_switchover: 60

# =====================================================
# 7. Kubernetes 配置
# =====================================================
kubernetes:
  namespace: "petadoptions"
  cluster_name: "${EKS_CLUSTER_NAME}"
  context_source: "${K8S_CONTEXT_SOURCE}"
  context_target: "${K8S_CONTEXT_TARGET}"

# =====================================================
# 7b. 容灾（DR）配置
#
# ⚠️ 数据层的 topology 全部如实填 "none"。这不是待填的 TODO，而是 2026-09-05
#    核对 CDK 后的**实测结论**：
#      PetAdoptions/cdk/pet_stack/lib/services-eks.ts:150
#        rds.DatabaseCluster(...auroraPostgres...)  ← 无 GlobalCluster
#      同文件 :795 / :849  ddb.Table(...)          ← 无 replicationRegions
#      同文件 :68        s3.Bucket(...)            ← 无复制配置
#
#    AWS Well-Architected REL13-BP02 对 pilot light 与 warm standby 的定义
#    **都要求**数据已复制到恢复区。当前状态下两档的数据层前提均不成立，
#    真实档位是 backup & restore（RPO 数小时）。
#
#    这里如实声明，是为了让 dr_profile.strategy_feasibility() 能把这个落差
#    报出来，而不是生成一份标称「RPO 秒级」的计划——那种计划在演练里可能
#    因为事前手工补过数据而侥幸通过，在真灾里必然失守。
#
#    要真正达到所声明的档位，需先在 CDK 里补上跨区复制，再把 topology 改掉。
# =====================================================
dr:
  target_region: "${DR_TARGET_REGION}"
  # 计算层按此生成步骤；数据层前提是否成立由 strategy_feasibility() 单独判定。
  strategy: "pilot_light"

  data:
    aurora:
      topology: "none"          # global_database | cross_region_replica | snapshot_copy | none
      cluster_identifier: "${AURORA_CLUSTER_ID}"
      global_cluster_identifier: "${AURORA_GLOBAL_CLUSTER_ID}"
    dynamodb:
      topology: "none"          # global_tables | none
      tables: []                # 由图谱提供实例清单，此处只声明拓扑
    s3:
      topology: "none"          # crr | crr_rtc | none
      buckets: []
    sqs:
      # 结构性事实，不是配置疏漏：SQS 没有跨区复制能力。
      # 切换瞬间源队列里 visible + in-flight 的消息即业务数据丢失。
      replicable: false

  eks:
    target_cluster: "${DR_EKS_CLUSTER_NAME}"
    # pilot light 下这些节点组常态 desired=0，切换时必须先扩容并等节点 Ready。
    nodegroups: []
    # ECR 是区域级服务；arm64 镜像未复制过去则一律 ImagePullBackOff。
    ecr_replication_required: true

  # 显式排除，且**必须带 reason**：审计要能看出是有意排除而非漏了。
  excluded:
    - pattern: "etl_*"
      reason: "platform_infrastructure：图谱 ETL，非 PetAdoptions 业务负载"
    - type: "NeptuneCluster"
      reason: "platform_infrastructure：图谱自身存储，非 PetAdoptions 业务数据"
    - namespace: "awesomeshop"
      reason: "data_pollution：DeepFlow 注入的虚构服务，副本数全 0，实际不存在"

# =====================================================
# 8. Neptune 配置
# =====================================================
neptune:
  endpoint: "${NEPTUNE_ENDPOINT}"
  port: 8182

  # 图 schema 文本（注入 LLM system prompt）
  # 从 rca/neptune/schema_prompt.py 的 GRAPH_SCHEMA 迁出（Wave 1, 2026-04-18）
  graph_schema_text: |

    ## 节点类型（39 种，schema 声明数）
    注意这是**schema 声明**的类型数，与活图谱里实际存在实例的类型数可能不同。
    TopologyChange 是追加式事件日志，稳态下可以 0 实例 —— 所以活图谱通常少 1 种。
    test_11 的 PENDING_FIRST_INSTANCE 就是为消解这个差异而存在；
    新增一个 0 实例的类型时必须同步加进那个集合，否则 schema⊆live 与 live⊆schema 两个断言会互锁。

    ### 基础设施层
    - Region: name(str), region_name(str)
    - AvailabilityZone: name(str), az_name(str)
    - VPC: name(str), vpc_id(str), cidr(str)
    - Subnet: name(str), subnet_id(str), az(str)
    - SecurityGroup: name(str), sg_id(str), description(str)

    ### 计算层
    - EC2Instance: instance_id(str), name(str), state(str), az(str), health_status(str), instance_type(str), private_ip(str)
    - EKSCluster: name(str), version(str)
    - Namespace: name(str), cluster(str)
    - Pod: name(str), status(str), node_name(str), namespace(str), ip(str), restarts(int)
    - Microservice: name(str), recovery_priority(Tier0|Tier1|Tier2), fault_boundary(region|az|global), az(str), replica_count(int), role(str), port(int), service_type(k8s|lambda)
      - 注：service_type='lambda' 的服务（如 petstatusupdater）fault_boundary='region'，由 AWS 自动跨 AZ 管理，没有 az 和 replica_count 属性。这是正常情况，不是状态异常。K8s 服务 fault_boundary='az'，查询副本需要按 AZ 分组。
      - fault_boundary 语义：'az' 表示 AZ 级服务（EC2/K8s Pod/EBS）；'region' 表示 Region 级服务（Lambda/DynamoDB/S3/SQS/SNS/API Gateway）；'global' 表示 Global 服务（IAM/Route53/CloudFront）。
    - K8sService: name(str), namespace(str), svc_type(str), cluster_ip(str), app_label(str)
      - ENA 限速属性（由 etl_deepflow 的 fetch_ena_allowance_throttling 写入 Microservice）：
        ena_bw_allowance_exceeded(bool), ena_pps_allowance_exceeded(bool),
        ena_conntrack_allowance_exceeded(bool)
        · 源头是 **EC2 ENA 网卡驱动**的计数器（主机上 `ethtool -S` 可见），
          不是 AWS Network Flow Monitor 的 RTT/重传 —— 后者走 CloudWatch/NFM API
          经 etl_aws 写 EC2Instance/VPC 节点。原属性名带 nfm_ 前缀会误导，已改名。
        · ⚠️ 已知缺陷：NFM agent 的 DaemonSet 是 hostNetwork，导出的样本带**节点 IP**，
          而写入侧用 Pod IP 查表，实测两集合为**空集** —— 这三个属性目前恒为 False，
          那是默认值不是观测结果。ENA 限速是节点级现象，应写 EC2Instance 或经
          Pod→Node 映射后归属服务。详见 todo 附录 E。
    - Deployment: name(str), namespace(str), replicas(int), ready_replicas(int), strategy(str), app_label(str)
    - HPA: name(str), namespace(str), min_replicas(int), max_replicas(int), current_replicas(int), target_kind(str), target_name(str)

    ### 网络层
    - LoadBalancer: name(str), dns(str), lb_type(str), scheme(str)
    - TargetGroup: name(str), arn(str)
    - ListenerRule: name(str), listener_arn(str), priority(int)

    ### 数据层
    - RDSCluster: name(str), engine(str), status(str), endpoint(str), reader_endpoint(str)
    - RDSInstance: name(str), instance_class(str), engine(str), status(str)
    - Database: name(str)  // 逻辑数据库（BelongsTo RDSCluster）
    - DynamoDBTable: name(str)
    - NeptuneCluster: name(str), engine(str), endpoint(str)
    - NeptuneInstance: name(str)
    - S3Bucket: name(str)

    ### 消息层
    - SQSQueue: name(str), is_dlq(bool)
    - SNSTopic: name(str), subscriptions_confirmed(int)

    ### 计算（Serverless）
    - LambdaFunction: name(str), runtime(str), memory_size_mb(int), concurrent_executions(int)
    - StepFunction: name(str), arn(str)

    ### 容器镜像
    - ECRRepository: name(str), uri(str)

    ### 业务层
    - BusinessCapability: name(str), recovery_priority(str), layer(str)

    ### 外部服务（观测源粒度）
    - AWSServiceEndpoint: name(str), granularity(str), xray_type(str), xray_aliases(str), last_seen(int)
      - X-Ray 服务图里**只有粗粒度服务名、拿不到具体资源名**的 AWS 托管服务身份。
        实测 X-Ray 把 S3 报成一个字面叫 `S3` 的节点，没有 bucket 名；STS / SSM /
        Secrets Manager 同理。图谱里有 30+ 个 S3Bucket，把 `S3` 猜成其中某一个
        是**推断而非观测** —— 用观测源的名义写推断结果就是编造，所以另立此类型。
      - granularity 恒为 'service'，与资源级节点（S3Bucket / DynamoDBTable 等）区分。
        查询时据此判断依赖精度：服务级只能回答「调了 S3」，资源级才能回答「调了哪个 bucket」。
      - xray_aliases: X-Ray 报过的原始名，'; ' 连接。SSM 与 SimpleSystemsManagement
        是同一服务的两种 SDK 命名，已归一到 ssm。
      - xray_type: 观测到的 AWS:: 类型集合，'; ' 连接。**刻意存集合而非取一个** ——
        ssm 同时以 AWS::SSM 与 AWS::SimpleSystemsManagement 出现，
        取一个等于记录「碰巧最后写入的那个」。
      - 由 etl_xray 写入。DeepFlow 侧看不到这一层：它只能从 DNS 域名
        （ssm.ap-northeast-1.amazonaws.com）反推，而 VPC 端点场景连域名都没有。

    ### 运维层
    - Incident: id(str), severity(P0|P1|P2), root_cause(str), resolution(str), start_time(str), status(str), affected_service(str)
    - ChaosExperiment: experiment_id(str), fault_type(str), result(passed|failed), recovery_time_sec(int), degradation_rate(float), timestamp(str)
    - TopologyChange: change_id(str), ts(int), kind(str), subject(str), source_name(str), target_name(str), edge_type(str), detail(str), provenance(str)
      - 拓扑变更事件（追加式日志）。kind 取值: dependency_deactivated | dependency_reactivated | dependency_appeared
      - 由 etl_deepflow 对账在依赖边 active 发生 true→false **状态转变**时写入，稳态不重复产生
      - 为什么需要它: CloudTrail 记录 AWS API 级变更（部署/实例停止/RDS 修改/扩缩容），
        但按构造看不见两类对依赖图谱最相关的变化 —— 依赖消失（A 不再调用 B，是「流量缺席」
        而非 API 调用）与依赖出现（应用内配置/开关导致 A 开始调 B）
      - 保留期由 TOPOLOGY_CHANGE_LOG_RETENTION_SECONDS 控制，默认 90 天，对账时顺带清理
      - 查询用 Q19: q19_topology_changes(service_name, since_seconds, limit)

    ### AgentCore / GenAI 组（2026-09-04 新增，写入源 agentcore-etl）
    身份键一律钉在 **AWS 侧分配的标识**（arn / kb id），刻意**不用** OTel 的 gen_ai.* 属性 ——
    后者在语义约定里 stability 全是 development，没有一个 stable，而本 schema 要求身份键不可变。
    这六类只由 etl_agentcore 一个 ETL 写，没有 etl_cfn 并写的历史包袱，
    所以直接用 arn 做身份键，不必像 LambdaFunction/DynamoDBTable 那样被卡着用 name。
    - AgentRuntime: arn(str), runtime_id(str), name(str), status(str), framework(str), model_id(str), endpoint_name(str), last_seen(int)
    - AgentTool: tool_key(str), tool_name(str), owner_arn(str), owner_kind(gateway|runtime), backend_kind(str), last_seen(int)
    - AgentGateway: arn(str), gateway_id(str), name(str), status(str), protocol(str), target_count(int), last_seen(int)
    - AgentMemory: arn(str), memory_id(str), name(str), status(str), strategy(str), last_seen(int)
    - KnowledgeBase: arn(str), kb_id(str), name(str), status(str), vector_store(str), embedding_model(str), last_seen(int)
    - Guardrail: arn(str), guardrail_id(str), name(str), status(str), version(str), last_seen(int)
      - AgentTool 的身份键是**复合键** `<owner_arn>#<tool_name>` —— tool 没有 ARN，
        它是 agent 进程内注册的函数或 Gateway 聚合出的虚拟 MCP 工具。
        **不能只用 tool_name**：两个 agent 各注册一个同名 get_pet 会被并成一个节点。
      - 这六类在 Stage 4 部署 AgentCore 之前是 **0 实例**，已加入
        test_11 的 PENDING_FIRST_INSTANCE，否则 schema⊆live 与 live⊆schema 两个断言会互锁。

    ## 边类型（29 种）

    ### 依赖边的通用属性（Calls / DependsOn / AccessesData 必带）
    这三种边表示「A 依赖 B」，与 LocatedIn / Contains / BelongsTo 等结构边不同，
    统一携带以下属性。查询依赖关系时应按 dependency_kind 过滤，
    否则「模板里声明但从未调用的依赖」与「每秒数百次的真实调用」会被等权对待。
    - dependency_kind: static | dynamic
        static  = 由 AWS 资源配置或 CloudFormation 模板「声明」出来（etl_aws / etl_cfn 写入），
                  声明存在不代表实际被调用过
        dynamic = 由 DeepFlow L7 / DNS「运行时观测」到（etl_deepflow 写入），
                  代表这条依赖真实发生过
    - source: aws-etl | cfn-etl | deepflow-etl | deepflow-dns | xray | business-layer | manual-fix
    - last_seen(int): 最近一次被观测到的 epoch 秒（dynamic 边）
    - first_seen(int): 自埋点起首次观测到的 epoch 秒（dynamic 边，非真实首现时间）
    - active(bool): dynamic 边是否仍被观测到。超过失效阈值未刷新会被置 false，
                    重新观测到会自动写回 true
    Calls 边额外带运行时度量：calls(int), avg_latency_us(int), p99_latency_ms(float),
    error_count(int), error_rate(float), protocol(str), port(int), call_type(str)

    ### 漂移验证属性（AccessesData / PublishesTo / InvokesVia 上，由 etl_deepflow 的对账写入）
    把「代码/模板声明的依赖」与「运行时实际观测」对账的结果。
    运行时观测有**两个源，OR 关系**（盲区不重叠：DNS 漏「连接复用」，X-Ray 漏「未插桩」）：
      · DeepFlow DNS —— 域名解析行为
      · AWS X-Ray  —— 服务到 AWS 托管服务的实际调用
    - drift_status: ok | declared_not_observed | observed_not_declared | observed_then_silent
        `observed_then_silent` 是 2026-09-05 新增的第四个取值，只出现在
        `dependency_kind='inference'` 的边上：曾被观测到、当前窗口内没有观测。
        它与前三个的区别在于**前三个都是对「声明与观测是否一致」的判断，
        而这一个是对「观测本身够不够近」的判断**。
        为什么不复用 declared_not_observed：agent 的进程内工具**没有任何声明**
        （控制面看不到它们，实测 13 个 AgentTool 里 8 个只能从 span 发现），
        说「声明了但没观测到」是事实错误。用一个语义邻近但不同的值会静默误导 ——
        与 etl_agentcore 里 empty/contradictory 的区分是同一个道理。
    - runtime_verified(bool): 是否被任一运行时源观测到
    - verified_by: dns | xray | dns+xray | none
        为什么必须有这个属性：双源验证下，X-Ray 若静默失效（权限丢失、服务未插桩、
        窗口内无流量），判定会**悄悄退回 DNS-only** 而结果看起来完全正常。
        读取方是 Q20 q20_dependency_verification —— 它把「单源验证」与
        「验证已过期」查出来，这是发现该失效的唯一途径。
    - last_drift_check(int): 最近一次对账的 epoch 秒
    注意这些是**边属性**，在 Neptune/TinkerPop 里天生单基数，
    不存在顶点那种 SET 累积问题（顶点必须用 property(single,...)，见 infra/fix_property_cardinality.py）。

    ### X-Ray 观测证据属性（由 etl_xray 写入，与 DeepFlow 平行的第二拓扑源）
    X-Ray 与 DeepFlow 是**两个独立的拓扑观测源**，不是主备关系：
      · X-Ray  —— 需应用埋点；只看得到已插桩的服务，但**能精确到 AWS 资源名**
                  （那张 DynamoDB 表的完整名字），并按下游逐个归因延迟
      · DeepFlow —— eBPF 零埋点；覆盖所有 Pod，但对 AWS 托管服务**只能到域名粒度**
    盲区不重叠，所以两者都写、都保留，让图谱成为对账中心。
    - xray_call_count(int) / xray_error_count(int) / xray_fault_count(int)
    - xray_total_response_time_s(float): 窗口内该依赖的累计响应时间。
        这是**只有 X-Ray 能给**的量：petsearch 总响应 1625s，其中 S3 占 1339s（82%），
        直接回答「服务慢在哪个下游」。DeepFlow 能给单流延迟，但归不到逻辑资源。
    - xray_window_hours(int): 观测窗口长度。X-Ray GetServiceGraph 单次上限 6 小时
        （超过报 Time range cannot be longer than 6 hours），24h 视图是分 4 段合并的。
    - xray_last_seen(int): X-Ray 最近一次观测到这条依赖的 epoch 秒。
        **刻意不设 observed_by_xray 布尔属性** —— 它完全可由本字段是否为 null 推导，
        而能被推导出来的布尔量迟早与来源不一致。
    写入纪律：边**已存在**（无论谁发现）时只补上述度量，
    **绝不覆盖 source / dependency_kind** —— 原 source 记录的是谁首先发现了这条依赖。
    只有 X-Ray 独自发现的新边才写 source='xray'。

    ### 拓扑/位置关系
    - (:Region)-[:Contains]->(:AvailabilityZone)
    - (:VPC)-[:LocatedIn]->(:Region)
    - (:Subnet)-[:LocatedIn]->(:VPC)
    - (:Subnet)-[:LocatedIn]->(:AvailabilityZone)
    - (:EC2Instance)-[:LocatedIn]->(:Subnet|:AvailabilityZone)
    - (:Pod)-[:LocatedIn]->(:AvailabilityZone)
    - (:RDSCluster)-[:LocatedIn]->(:Region)
    - (:RDSInstance)-[:LocatedIn]->(:AvailabilityZone)
    - (:NeptuneCluster)-[:LocatedIn]->(:Region)
    - (:NeptuneInstance)-[:LocatedIn]->(:AvailabilityZone)
    - (:S3Bucket|:SNSTopic|:SQSQueue|:ECRRepository|:EKSCluster)-[:LocatedIn]->(:Region)
    - (:AWSServiceEndpoint)-[:LocatedIn]->(:Region)
    - (:LoadBalancer)-[:LocatedIn]->(:AvailabilityZone)
    - (:Microservice)-[:LocatedIn]->(:EKSCluster)

    ### 归属关系
    - (:EC2Instance)-[:BelongsTo]->(:EKSCluster)
    - (:Namespace)-[:BelongsTo]->(:EKSCluster)
    - (:Microservice)-[:OwnedBy]->(:Namespace)
    - (:RDSInstance)-[:BelongsTo]->(:RDSCluster)
    - (:NeptuneInstance)-[:BelongsTo]->(:NeptuneCluster)
    - (:Database)-[:BelongsTo]->(:RDSCluster)

    ### 安全组关系
    - (:EC2Instance|:RDSCluster|:NeptuneCluster|:LoadBalancer|:EKSCluster)-[:HasSG]->(:SecurityGroup)
    - (:SecurityGroup)-[:ProtectsAccess]->(:LambdaFunction)

    ### 运行关系
    - (:Microservice)-[:RunsOn]->(:Pod)
    - (:Pod)-[:RunsOn]->(:EC2Instance)
    - (:K8sService)-[:Implements]->(:Microservice|:LambdaFunction)
    - (:K8sService)-[:Routes]->(:Pod)
    - (:Pod)-[:BelongsTo]->(:K8sService)
    - (:Deployment)-[:Manages]->(:Microservice|:Pod)

    ### 网络/路由关系
    - (:LoadBalancer)-[:HasRule]->(:ListenerRule)
    - (:ListenerRule)-[:ForwardsTo]->(:TargetGroup)
    - (:LoadBalancer)-[:ForwardsTo|:RoutesTo]->(:TargetGroup)
    - (:TargetGroup)-[:ForwardsTo]->(:Microservice)

    ### 调用关系（运行时，来自 DeepFlow 或 X-Ray）
    - (:Microservice)-[:Calls]->(:Microservice)

    ### 数据访问关系（⚠️ 注意：微服务到数据库用 AccessesData，不是 DependsOn）
    - (:Microservice)-[:AccessesData]->(:RDSCluster|:DynamoDBTable|:S3Bucket|:StepFunction)
    - (:LambdaFunction)-[:AccessesData]->(:DynamoDBTable|:RDSCluster|:LambdaFunction)
    - (:Microservice)-[:ConnectsTo]->(:Database)
    - (:Microservice|:LambdaFunction)-[:AccessesData]->(:AWSServiceEndpoint)  // X-Ray 观测的服务级依赖

    ### 依赖关系（DependsOn 用于镜像依赖和队列依赖，不用于数据库）
    - (:Microservice)-[:DependsOn]->(:ECRRepository|:SQSQueue)
    - (:BusinessCapability)-[:DependsOn]->(:RDSCluster|:SNSTopic|:SQSQueue)

    ### 消息/事件关系
    - (:Microservice)-[:PublishesTo]->(:SNSTopic|:SQSQueue)
    - (:Microservice)-[:WritesTo]->(:SQSQueue|:SNSTopic|:S3Bucket)
    - (:LambdaFunction)-[:WritesTo]->(:NeptuneCluster)
    - (:Microservice)-[:InvokesVia]->(:StepFunction)
    - (:SNSTopic)-[:Invokes]->(:LambdaFunction)
    - (:LambdaFunction)-[:Invokes]->(:LambdaFunction)
    - (:StepFunction)-[:Invokes]->(:LambdaFunction)
    - (:SQSQueue)-[:TriggeredBy]->(:LambdaFunction)

    ### 业务关系
    - (:Microservice)-[:Implements]->(:BusinessCapability)
    - (:LambdaFunction)-[:Implements]->(:BusinessCapability)

    ### 运维关系
    - (:Incident)-[:TriggeredBy]->(:Microservice)
    - (:Incident)-[:AffectedService]->(:Microservice)
    - (:Incident)-[:Involves]->(:Microservice)  // Incident 的 root_cause 服务关联（用于历史相似匹配）
    - (:Incident)-[:MentionsResource]->(:Microservice|:EC2Instance)  // Incident 描述中提取的实体关联
    - (:Microservice)-[:TestedBy]->(:ChaosExperiment)

    ### AgentCore / GenAI 关系（2026-09-04 新增，写入源 agentcore-etl）
    资源节点来自 bedrock-agentcore-control 控制面 API；调用边只能来自 aws/spans ——
    控制面看不到「谁调了谁」，那只存在于运行时 span 里。
    - (:AgentRuntime)-[:Delegates]->(:AgentRuntime)  // 编排 agent → 子 agent（orchestrator → nutrition/ordering/adoption/concierge）
    - (:AgentRuntime)-[:InvokesTool]->(:AgentTool)  // 刻意不复用 Invokes：那个是 dependency:false 的结构边，agent→tool 是真依赖
    - (:AgentRuntime)-[:Retrieves]->(:KnowledgeBase)  // KB 检索。失败模式是「调用成功但结果为空」，判据看输出质量而非错误率
    - (:AgentRuntime)-[:AccessesData]->(:AgentMemory|:AWSServiceEndpoint)  // 读写 Memory；调 Bedrock 模型落 AWSServiceEndpoint
    - (:AgentGateway)-[:RoutesTo]->(:AgentTool)  // Gateway 把多 target 聚合成单一虚拟 MCP server 后分发
    - (:Guardrail)-[:ProtectsAccess]->(:AgentRuntime)  // 与 SecurityGroup→LambdaFunction 同构：一道策略保护一个执行体
    - (:AgentTool)-[:DependsOn]->(:LambdaFunction|:Microservice)  // ★ 把 agent 子图接回既有 PetSite 图的唯一通路
      - 最后那条是关键：缺了它，六个 agent 节点类型会在图里形成一座孤岛 ——
        能查到 agent 内部结构，却回答不了「petsite 挂了会影响哪个 agent」。
      - agent 侧的依赖边 TTL 统一 21600（6h），与 AccessesData 同源同窗口；
        取值不同会出现「一条边失效了、同源的另一条还在」的不一致。

    ## 已知服务名（PetSite 应用）
    petsite, petsearch, payforadoption, petlistadoptions, pethistory, petstatusupdater, trafficgenerator, artillery, artillery-write, auth-service, gateway-service, order-service, points-service, product-service

  # Few-shot 示例（Wave 2 扩到 25+ 条，2026-04-18）
  nl_query_examples:
    # --- 基础查询（Wave 1 进入的 10 条） ---
    - q: "petsite 依赖哪些数据库？"
      cypher: "MATCH (s:Microservice {name:'petsite'})-[:AccessesData]->(db) WHERE db:RDSCluster OR db:DynamoDBTable RETURN db.name AS database, labels(db)[0] AS type"
    - q: "petsite 的所有下游依赖有哪些？"
      cypher: "MATCH (s:Microservice {name:'petsite'})-[r:Calls|AccessesData|PublishesTo|InvokesVia|DependsOn]->(d) RETURN d.name AS dependency, labels(d)[0] AS type, type(r) AS relation"
    - q: "AZ ap-northeast-1a 有哪些服务？"
      cypher: "MATCH (s:Microservice)-[:RunsOn]->(p:Pod)-[:RunsOn]->(e:EC2Instance)-[:LocatedIn]->(az:AvailabilityZone {name:'ap-northeast-1a'}) RETURN DISTINCT s.name AS service, count(p) AS pod_count"
    - q: "payforadoption 的上游调用者有哪些？"
      cypher: "MATCH (caller)-[:Calls]->(s:Microservice {name:'payforadoption'}) RETURN caller.name AS caller, labels(caller)[0] AS type"
    - q: "上个月 petsite 发生过几次故障？"
      cypher: "MATCH (inc:Incident)-[:TriggeredBy]->(s:Microservice {name:'petsite'}) WHERE inc.start_time >= $since RETURN inc.id AS incident, inc.severity AS severity, inc.root_cause AS root_cause ORDER BY inc.start_time DESC"
    - q: "哪些服务从未做过混沌实验？"
      cypher: "MATCH (s:Microservice) WHERE NOT (s)-[:TestedBy]->(:ChaosExperiment) RETURN s.name AS service, s.recovery_priority AS priority ORDER BY CASE s.recovery_priority WHEN 'Tier0' THEN 0 WHEN 'Tier1' THEN 1 ELSE 2 END"
    - q: "petsite 完整的基础设施路径（到 AZ）"
      cypher: "MATCH (s:Microservice {name:'petsite'})-[:RunsOn]->(p:Pod)-[:RunsOn]->(e:EC2Instance)-[:LocatedIn]->(az:AvailabilityZone) RETURN p.name AS pod, p.status AS pod_status, e.instance_id AS ec2, e.state AS ec2_state, az.name AS az"
    - q: "所有 P0 故障及其根因"
      cypher: "MATCH (inc:Incident) WHERE inc.severity = 'P0' RETURN inc.id AS incident, inc.root_cause AS root_cause, inc.affected_service AS service, inc.start_time AS start_time ORDER BY inc.start_time DESC LIMIT 20"
    - q: "哪些 RDS 集群有安全组关联？"
      cypher: "MATCH (r:RDSCluster)-[:HasSG]->(sg:SecurityGroup) RETURN r.name AS cluster, sg.name AS security_group, sg.sg_id AS sg_id"
    - q: "petsite 用了哪些 ECR 镜像？"
      cypher: "MATCH (s:Microservice {name:'petsite'})-[:DependsOn]->(ecr:ECRRepository) RETURN ecr.name AS repository, ecr.uri AS uri"

    # --- AccessesData vs DependsOn 歧义消除 ---
    - q: "哪些服务写 DynamoDB？"
      cypher: "MATCH (s:Microservice)-[:AccessesData]->(t:DynamoDBTable) RETURN s.name AS service, t.name AS table"
    - q: "petsite 依赖哪些 SQS 队列？"
      cypher: "MATCH (s:Microservice {name:'petsite'})-[:DependsOn]->(q:SQSQueue) RETURN q.name AS queue, q.is_dlq AS is_dlq"
    - q: "哪些服务同时访问 RDS 和 DynamoDB？"
      cypher: "MATCH (s:Microservice)-[:AccessesData]->(r:RDSCluster) WITH s MATCH (s)-[:AccessesData]->(d:DynamoDBTable) RETURN DISTINCT s.name AS service"

    # --- Tier / recovery_priority 排序模式 ---
    - q: "按 Tier 排序列出所有服务"
      cypher: "MATCH (s:Microservice) RETURN s.name AS service, s.recovery_priority AS tier ORDER BY CASE s.recovery_priority WHEN 'Tier0' THEN 0 WHEN 'Tier1' THEN 1 WHEN 'Tier2' THEN 2 ELSE 3 END, s.name"
    - q: "列出所有 Tier0 服务"
      cypher: "MATCH (s:Microservice) WHERE s.recovery_priority = 'Tier0' RETURN s.name AS service, s.fault_boundary AS fault_boundary, s.service_type AS service_type"

    # --- Lambda 特殊处理（service_type='lambda'，fault_boundary='region'） ---
    - q: "哪些服务是 Lambda 实现的？"
      cypher: "MATCH (s:Microservice) WHERE s.service_type = 'lambda' RETURN s.name AS service, s.fault_boundary AS fault_boundary"
    - q: "Region 级服务（非 AZ 级）有哪些？"
      cypher: "MATCH (s:Microservice) WHERE s.fault_boundary = 'region' RETURN s.name AS service, s.service_type AS service_type, s.recovery_priority AS priority"
    - q: "petstatusupdater 调用哪些 Lambda 或 DynamoDB？"
      cypher: "MATCH (l:LambdaFunction {name:'petstatusupdater'})-[:AccessesData|:Invokes]->(d) RETURN d.name AS target, labels(d)[0] AS type"

    # --- 按 AZ 分组 / 多 AZ 聚合 ---
    - q: "每个 AZ 上运行着多少 Pod？"
      cypher: "MATCH (p:Pod)-[:LocatedIn]->(az:AvailabilityZone) RETURN az.name AS az, count(p) AS pod_count ORDER BY az.name"
    - q: "petsite 的副本分布在哪些 AZ？"
      cypher: "MATCH (s:Microservice {name:'petsite'})-[:RunsOn]->(p:Pod)-[:LocatedIn]->(az:AvailabilityZone) RETURN az.name AS az, count(p) AS replica_count ORDER BY az.name"

    # --- BusinessCapability 影响面 ---
    - q: "RDS 挂了影响哪些业务能力？"
      cypher: "MATCH (bc:BusinessCapability)-[:DependsOn]->(r:RDSCluster) RETURN bc.name AS capability, bc.recovery_priority AS priority, r.name AS cluster"
    - q: "实现 订单 能力的服务有哪些？"
      cypher: "MATCH (s)-[:Implements]->(bc:BusinessCapability) WHERE bc.name CONTAINS '订单' OR bc.name CONTAINS 'order' OR bc.name CONTAINS 'Order' RETURN s.name AS service, labels(s)[0] AS type, bc.name AS capability"

    # --- Incident + AffectedService 联合 ---
    - q: "最近 10 条 incident 及其受影响服务"
      cypher: "MATCH (inc:Incident)-[:AffectedService]->(s:Microservice) RETURN inc.id AS incident, inc.severity AS severity, inc.start_time AS start_time, collect(DISTINCT s.name) AS affected_services ORDER BY inc.start_time DESC LIMIT 10"
    - q: "哪些服务出过 P0 故障？"
      cypher: "MATCH (inc:Incident {severity:'P0'})-[:AffectedService|:TriggeredBy]->(s:Microservice) RETURN DISTINCT s.name AS service, count(inc) AS p0_count ORDER BY p0_count DESC"

    # --- 否定查询 / NOT EXISTS ---
    - q: "哪些服务没有 Tier0 标记？"
      cypher: "MATCH (s:Microservice) WHERE s.recovery_priority IS NULL OR s.recovery_priority <> 'Tier0' RETURN s.name AS service, s.recovery_priority AS priority"
    - q: "哪些 Tier0 服务不在任何混沌实验覆盖中？"
      cypher: "MATCH (s:Microservice {recovery_priority:'Tier0'}) WHERE NOT (s)-[:TestedBy]->(:ChaosExperiment) RETURN s.name AS service"

    # --- 跨层级拓扑 ---
    - q: "petsite 的 Pod 所在的 EC2 和所属 VPC 网段"
      cypher: "MATCH (s:Microservice {name:'petsite'})-[:RunsOn]->(p:Pod)-[:RunsOn]->(e:EC2Instance)-[:LocatedIn]->(sub:Subnet)-[:LocatedIn]->(vpc:VPC) RETURN p.name AS pod, e.instance_id AS ec2, sub.subnet_id AS subnet, vpc.vpc_id AS vpc"
    - q: "LoadBalancer 背后转发到哪些服务？"
      cypher: "MATCH (lb:LoadBalancer)-[:ForwardsTo|:RoutesTo]->(tg:TargetGroup)-[:ForwardsTo]->(s:Microservice) RETURN lb.name AS lb, lb.dns AS dns, tg.name AS target_group, s.name AS service"

    # --- 混沌实验 / 恢复时间统计 ---
    - q: "最近 20 次混沌实验结果与息复时间"
      cypher: "MATCH (s:Microservice)-[:TestedBy]->(ce:ChaosExperiment) RETURN s.name AS service, ce.experiment_id AS experiment, ce.fault_type AS fault, ce.result AS result, ce.recovery_time_sec AS recovery_sec ORDER BY ce.timestamp DESC LIMIT 20"
    - q: "混沌实验息复时间超过 300 秒的服务"
      cypher: "MATCH (s:Microservice)-[:TestedBy]->(ce:ChaosExperiment) WHERE ce.recovery_time_sec > 300 RETURN DISTINCT s.name AS service, max(ce.recovery_time_sec) AS max_recovery ORDER BY max_recovery DESC"

  # Wave 4 空结果重试提示用
  common_relations:
    - AccessesData
    - DependsOn
    - Calls
    - RunsOn
    - LocatedIn
    - PublishesTo
    - Invokes
    - Implements
    - TriggeredBy
    - AffectedService

  # Wave 4+ query_guard 规则
  guard_rules:
    forbidden_operations: [CREATE, DELETE, DETACH, SET, MERGE, REMOVE, DROP, CALL]
    max_hop_depth: 6
    default_limit: 200

  # Wave 5 复杂问题触发词（切 Opus 模型）
  complex_keywords:
    zh: [完整, 全部, 影响, 所有上下游, 路径, 链路, 整个, 整体]
    en: [full, all, impact, upstream, downstream, path, entire, overall]

# =====================================================
# 9. 监控配置
# =====================================================
monitoring:
  cloudwatch_alarm_prefix: "petsite"
  dashboard_name: "petsite-dashboard"

# =====================================================
# 10. Chaos 工程配置
# =====================================================
chaos:
  rca_lambda_name: "petsite-rca-engine"
  fis_stop_condition_prefix: "chaos-"
  default_namespace: "petadoptions"
  stop_condition_alarms:
    - service: petstatusupdater
      alarm_name: "chaos-petstatusupdater-sr-critical"
      metric: "Errors"
      namespace: "AWS/Lambda"
      threshold: 5
    - service: petlistadoptions
      alarm_name: "chaos-petlistadoptions-sr-critical"
      metric: "HTTPCode_Target_5XX_Count"
      namespace: "AWS/ApplicationELB"
      threshold: 10
