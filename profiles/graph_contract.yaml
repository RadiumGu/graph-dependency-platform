# 图谱契约 —— 机器可读的权威声明
#
# 这份文件是 **ETL 写入门禁读取的权威**。profiles/petsite.yaml 的
# neptune.graph_schema_text 是给人和 LLM 读的叙述，两者平级、互不生成。
# 类型名集合必须完全相同，由 tests/test_35_graph_contract.py 强制；
# 漂移即测试失败。这样就不会再出现「声明说 33 种、代码里写进去 34 种」。
#
# 为什么需要它：在引入本文件之前，四个写入 ETL 无一 import profiles，
# 运行时对节点/边类型零校验 —— 任何拼错或新造的标签都会被静默写进 Neptune。
# 参见 todo/graph-correctness-audit-and-gaps_20260830-1435.md 缺口 1。
#
# 由 scripts/bootstrap_graph_contract.py 初次生成，此后手工维护。
# Lambda 层产物 infra/lambda/shared/python/graph_contract.py
# 由 scripts/gen_graph_contract.py 从本文件生成（test_35 校验未过期）。
version: 1
timestamp_field: last_seen
timestamp_legacy_aliases:
- last_updated
- last_scanned
# 合法的 source 取值词表。**由 graph_contract.assert_source() 在写入时强制**
# （2026-08-31 补：此前本清单只被 re-export、没有任何检查读它，
#  于是活图谱实测出 4 种未声明取值共 1263 条——声明而不设门禁等于没声明）。
sources:
- aws-etl
# K8s 采集路径写的边（Pod/Deployment/K8sService/Namespace 相关）。与 aws-etl 分开是
# 刻意的：这批边的真值来源是 Kubernetes API 而非 AWS 控制面 API，失败模式也不同。
- eks-etl
# AWS 资源配置里**静态声明**的跨服务依赖（例如 Lambda env 引用），
# 与运行时观测得到的同类边区分。
- aws-etl-static
- cfn-etl
- deepflow-etl
- deepflow-l4
- deepflow-dns
- nfm
- xray
- business-layer
- manual-fix
# AgentCore 资源与 agent 调用边的写入源。与 xray 分开是**刻意的**：
# agent 侧的真值来源是 bedrock-agentcore-control 控制面 API（资源节点）
# 与 aws/spans 结构化日志（调用边，Transaction Search 开启后 100% span 落那里），
# 与 X-Ray 的 GetServiceGraph 是两条独立链路，失败模式也不同 ——
# 前者失败表现为节点缺失，后者失败表现为边缺失。
- agentcore-etl
edge_write_once_attrs:
- source
- dependency_kind
- first_seen
