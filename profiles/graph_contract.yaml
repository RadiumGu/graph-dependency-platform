    expires_seconds: 21600
    note: 受 drift 对账覆盖
    pairs:
    - - Microservice
      - SNSTopic
    - - Microservice
      - SQSQueue
    src:
    - Microservice
  Retrieves:
    dependency: true
    dst:
    - KnowledgeBase
    expires_seconds: 21600
    note: 'agent → Knowledge Base 的检索（本环境是 nutrition agent 查 10 篇宠物营养

      知识文档）。是依赖边：KB 检索失败会让 agent 的回答质量下降。

      ⚠️ 这条边的失效模式与微服务不同 —— KB 返回空结果时调用**是成功的**，

      表现为输出质量下降而非错误率上升。所以它的证伪判据要看

      response-quality / task-success，不是 infrastructure error rate。

      '
    pairs:
    - - AgentRuntime
      - KnowledgeBase
    src:
    - AgentRuntime
  Routes:
    dependency: false
    dst:
    - Pod
    expires_seconds: null
    pairs:
    - - K8sService
      - Pod
    src:
    - K8sService
  RoutesTo:
    dependency: false
    dst:
    - AgentTool
    - TargetGroup
    expires_seconds: null
    note: '⚠️ **迁移期状态（2026-09-07）**：本标签正在被拆分。

      [AgentGateway, AgentTool] 这一对是**错的**，实测（bedrock-agentcore-control
      的 GetGatewayTarget）证明网关 target 的 targetType 全是 AGENTCORE_RUNTIME、
      配置指向 runtime ARN —— 目标应是 AgentRuntime，且那是**真依赖**，
      已另立 RoutesToRuntime。

      **这一对暂时保留不能删**：删了之后 assert_edge_type 会在生产里拒写并抛错，
      因为已部署的 etl_agentcore 还在写这种边。删除必须排在
      「ETL 改完 + 部署 + 存量清理」之后，顺序见
      todo/agentobv/agent-layer-taxonomy-design_20260905-1640.md §4。

      保留的那一对 [LoadBalancer, TargetGroup] 是纯转发配置，dependency: false 正确。'
    pairs:
    - - AgentGateway
      - AgentTool
    - - LoadBalancer
      - TargetGroup
    src:
    - AgentGateway
    - LoadBalancer
  RoutesToRuntime:
    dependency: true
    dst:
    - AgentRuntime
    expires_seconds: 21600
    note: '网关到 agent runtime 的路由。真值来源是控制面 ListGatewayTargets +
      GetGatewayTarget（targetConfiguration.http.agentcoreRuntime.arn）。

      **刻意不复用 RoutesTo**：那个标签同时用于 LoadBalancer → TargetGroup 的转发
      配置且 dependency: false。本边是真依赖 —— runtime 不可用时网关这条路由就是
      断的。而 dependency 是**边类型级**的标志，一个标签无法同时取两个值 ——
      这正是 2026-09-05 那 5 条边越界携带 dependency_kind 的根因。

      target 的元信息（target_id / target_name / target_type /
      credential_provider / target_status）作为**边属性**承载，
      **不**单独建 AgentGatewayTarget 节点 —— 那一层没有独立失效语义，
      两端都已是节点，插一层只会让所有影响面查询多一跳。

      dependency_kind 取 static：控制面声明，与流量无关。'
    pairs:
    - - AgentGateway
      - AgentRuntime
    src:
    - AgentGateway
  RoutesVia:
    dependency: true
    dst:
    - AgentGateway
    expires_seconds: 21600
    note: 'agent 的出站调用经由网关路由。**这条边补的是一个已确认的活体单点故障**。

      实测依据（2026-09-07，orchestrator 的运行时日志组）：
      scope=opentelemetry.instrumentation.httpx / name=POST / kind=CLIENT 的 span，
      attributes.aws.remote.service 指向网关主机名，
      attributes.aws.remote.operation 形如 "POST /adoption" 直接给出 target 名。
      窗口 09-04→09-07 四个子 agent 全部出现（adoption 145 / nutrition 61 /
      ordering 42 / concierge 17 次），全部 HTTP 200。

      **为什么必须单独建这条边**：网关承载全部 agent 间流量，它失效 ⇒
      orchestrator 到 4 个子 agent 全断 ⇒ 多 agent 系统整体失效。
      在这条边存在之前，图对此完全沉默，影响面分析会给出偏乐观的错误答案。

      **为什么不复用 DependsOn**：本边断裂会让多 agent 协作整体瓦解，
      而单 agent 直调仍可用；两者失效影响面不同，合成一个标签就无法分别推导。

      dependency_kind 取 dynamic（**不是 static**）：已实测到持续流量
      （跨 4 天、约每 5 分钟、无中断），按本项目定义 dynamic = 持续观测到流量。
      这也让它落入 deactivate_stale_dynamic_edges 的失效管辖，而非 inference
      那条「稀疏突发、不判失效」通道 —— 对稳态流量是正确的选择。'
    pairs:
    - - AgentRuntime
      - AgentGateway
    src:
    - AgentRuntime
  RunsOn:
    dependency: false
    dst:
    - EC2Instance
    - Pod
    expires_seconds: null
    pairs:
    - - Microservice
      - Pod
    - - Pod
      - EC2Instance
    src:
    - Microservice
    - Pod
  TestedBy:
    dependency: false
    dst:
    - ChaosExperiment
    expires_seconds: null
    pairs:
    - - Microservice
      - ChaosExperiment
    src:
    - Microservice
  TriggeredBy:
    dependency: false
    dst:
    - LambdaFunction
    - Microservice
    expires_seconds: null
    pairs:
    - - Incident
      - Microservice
    - - SQSQueue
      - LambdaFunction
    src:
    - Incident
    - SQSQueue
  WritesTo:
    dependency: false
    dst:
    - NeptuneCluster
    - S3Bucket
    - SNSTopic
    - SQSQueue
    expires_seconds: null
    pairs:
    - - LambdaFunction
      - NeptuneCluster
    - - Microservice
      - S3Bucket
    - - Microservice
      - SNSTopic
    - - Microservice
      - SQSQueue
    src:
    - LambdaFunction
    - Microservice
edge_verification:
  attrs:
  - verify_status
  - verify_confidence
  - verify_last
  - verify_by
  - verify_experiment
  - verify_degradation
  authority:
  - chaos-runner
  evidence_weights:
    intervention_confirmed: 4.0
    intervention_refuted: -4.0
    observed_cap: 1.5
    observed_per_source: 0.5
    static_declaration: 1.0
  statuses:
  - untested
  - confirmed
  - refuted
  - inconclusive
  thresholds:
    confirm_degradation_pct: 20.0
    hard_degradation_pct: 70.0
    min_observation_requests: 20
    refute_degradation_pct: 5.0
    stale_verification_seconds: 2592000
edge_write_once_attrs:
- source
- dependency_kind
- first_seen
node_attr_authority:
  Microservice:
    az:
    - aws-etl
    fault_boundary:
    - aws-etl
    recovery_priority:
    - aws-etl
    - business-layer
node_scope:
  attr: scope
  authority:
  - scope-labeler
  namespace_map:
    amazon-cloudwatch: observability
    amazon-guardduty: observability
    amazon-network-flow-monitor: observability
    awesomeshop: observed
    chaos-mesh: platform
    deepflow: observability
    kube-system: cluster-infra
    petadoptions: observed
  nested_stack_scope: scaffolding
  primary_query_scope: observed
  resolvers:
  - k8s-namespace
  - cloudformation-stack-membership
  - node-type
  - profile-declaration
  stack_map:
    AlertBufferStack: platform
    Applications: observed
    AwesomeShopInfra: observed
    CDKToolkit: scaffolding
    NeptuneEtlStack: platform
    ServicesEks2: observed
    WaggleAIAgents: observed
  # node-type resolver 的词表。只放「按构造即可判定、不需要查任何外部系统」的
  # 类型；凡是同一类型可能属于不同系统的（SecurityGroup / Subnet / VPC /
  # EC2Instance / S3Bucket …）一律不进这张表 —— 本账号里就混着 openclaw /
  # kronos / grafana 等无关项目的同类资源，按类型一刀切会造出假归属。
  #
  # agent 层（AgentRuntime / AgentTool / KnowledgeBase / AgentMemory /
  # Guardrail / AgentGateway）**刻意不在此表内**：它们按「被观测系统的配置是否
  # 声明可达」判定，判不出就是 unknown。按类型映射成 platform 会让选边器把
  # 业务关键的 agent 边排除掉，那正是 2026-09-05 修掉的 bug。
  type_map:
    # AWS 托管服务端点：按定义就是被观测系统之外的 AWS 服务，
    # 不属任何栈、不在任何 K8s namespace 里。
    AWSServiceEndpoint: external
    SaaSEndpoint: external
    # AWS 全局事实，不属任何栈也不属任何系统
    AvailabilityZone: external
    Region: external
    # 逻辑声明节点：业务能力是对被观测系统的抽象
    BusinessCapability: observed
    # 平台自己产出的分析件：按构造即 platform，无需查任何外部系统
    ChaosExperiment: platform
    Incident: platform
    NeptuneCluster: platform
    NeptuneInstance: platform
    TopologyChange: platform
  unresolved_value: unknown
  # default namespace 是混放的，namespace_map 对它无能为力。但里面有一批
  # **身份按定义就确定**的可观测性 agent（DaemonSet 形态、每个节点一个副本），
  # 实测 14 个 xray-daemon-* Pod 因此躺在 unknown 里，污染业务视图。
  #
  # 只收这一类：名字即工作负载名、身份无歧义、且该工作负载整体属于某个 scope。
  # 业务服务**不要**往这里加 —— 它们的权威声明在 profiles/petsite.yaml，
  # 走 profile-declaration resolver，不要造第二个声明源。
  workload_map:
    aws-otel-collector: observability
    cloudwatch-agent: observability
    fluent-bit: observability
    otel-collector: observability
    xray-daemon: observability
  # 平台自己拥有的命名前缀 → scope。只放**平台独占且无歧义**的前缀。
  #
  # 为什么需要这张表：`neptune-etl-from-aws` / `-deepflow` 在 NeptuneEtlStack 里，
  # 靠栈归属就判成 platform；但 `-xray` / `-agentcore` / `-appsignals` 是手工
  # `aws lambda create-function` 建出来的，不属任何栈，栈归属对它们无能为力，
  # 于是落到 unknown。而 unknown **不在选边器的 EXCLUDED_SCOPES 里**，
  # 结果平台会把自己的 ETL 选成故障注入靶点。
  #
  # ⚠️ 这里判不出 scope 只是**症状**，病因是三个生产 Lambda 绕过了基础设施即代码。
  #    本表让症状消失，但不要让它把病因盖住 ——
  #    见 todo/tech-debt-etl-lambdas-outside-cfn.md。
  #
  # 业务资源**不要**加进来：它们的权威声明在 profiles/petsite.yaml，
  # 走 profile-declaration resolver，不要造第二个声明源。
  name_prefix_map:
    neptune-etl-from-: platform
    neptune-etl-trigger: platform
  values:
  - observed
  - observability
  - platform
  - scaffolding
  - cluster-infra
  - external
  - unknown
node_types:
  AWSServiceEndpoint:
    expires_seconds: 604800
    identity: name
    immutable: true
    note: 归一化后的服务名（ssm 与 SimpleSystemsManagement 已归一）
  AgentGateway:
    expires_seconds: 604800
    identity: arn
    immutable: true
    note: AgentCore Gateway。把 Lambda / OpenAPI / 外部 MCP server 等聚合成单一虚拟 MCP server
    writer: etl_agentcore
  AgentMemory:
    expires_seconds: 604800
    identity: arn
    immutable: true
    note: AgentCore Memory。实测东京已有一个 ACTIVE 实例（xgg_memory-5M0VYBCeFS，2026-07-22 建）
    writer: etl_agentcore
  AgentRuntime:
    expires_seconds: 604800
    identity: arn
    immutable: true
    note: Bedrock AgentCore Runtime。arn 形如 arn:aws:bedrock-agentcore:<region>:<acct>:runtime/<id>
    writer: etl_agentcore
  AgentTool:
    expires_seconds: 604800
    identity: tool_key
