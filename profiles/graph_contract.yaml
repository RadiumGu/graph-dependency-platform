      adoption/concierge 四个）。唯一写入源是 aws/spans —— 控制面 API 看不到

      「谁调了谁」，那只存在于运行时 span 里。

      TTL 取 21600（6h）与 AccessesData 一致：同为 span 派生，用同一个源窗口，

      否则会出现「一条边失效了、同源的另一条还在」的不一致。

      ⚠️ 判据陷阱：tool 级/agent 级故障被优雅处理后**完成为成功调用**，对基础设施

      错误指标不可见。验证这条边真实存在要看 agent 自己的信号，不是 HTTP 5xx。

