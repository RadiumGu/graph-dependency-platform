    - - VPC
      - Region
    src:
    - AWSServiceEndpoint
    - EC2Instance
    - ECRRepository
    - EKSCluster
    - LoadBalancer
    - Microservice
    - NeptuneCluster
    - NeptuneInstance
    - Pod
