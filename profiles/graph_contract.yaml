    src:
    - LambdaFunction
    - SNSTopic
    - StepFunction
  InvokesTool:
    dependency: true
    dst:
    - AgentTool
    expires_seconds: 21600
    note: 'agent → tool 的调用。**刻意不复用现有 Invokes**。

      2026-09-05 更新：此前这里的理由是「Invokes 那个 dependency: false」，

      但同日 Invokes 已改判为 dependency: true（StepFunction/SNS → LambdaFunction

      按任何定义都是真依赖），**那条理由已失效**。不复用的理由改为下面两条，

      两条都仍然成立：

      (1) 端点类型不同：Invokes 的目标是 LambdaFunction，本边是 AgentTool；

      (2) **失效语义不同**：本边的 dependency_kind 是 inference（LLM 按 query

      在运行时决定），由 mark_stale_inference_edges 标记观测静默、**不置

      active=false**；而 Invokes 是 static（配置声明），走的是另一条失效路径。

      把两者塞进一个标签，会让「按 dependency_kind 过滤失效」的清理逻辑

      对两种本质不同的边施加同一套判据 —— 实测代价见 graph_cleanup 里

      Retrieves → nutrition-kb 被误置 active=false 那段。

      '
    pairs:
    - - AgentRuntime
      - AgentTool
    src:
    - AgentRuntime
  InvokesVia:
    dependency: false
    dst:
    - StepFunction
    expires_seconds: 21600
    note: 受 drift 对账覆盖
    pairs:
    - - Microservice
      - StepFunction
    src:
    - Microservice
  Involves:
    dependency: false
    dst:
    - Microservice
