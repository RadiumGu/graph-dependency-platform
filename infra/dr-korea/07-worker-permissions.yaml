AWSTemplateFormatVersion: '2010-09-09'
Description: DR worker 的增量权限（独立成栈，刻意不改 02-temporal.yaml）—— 2026-10-05 起只读

# DR worker 的增量权限 —— 独立成栈，刻意不改 02-temporal.yaml。
#
# ## 为什么不直接加到 02-temporal.yaml 里
#
# 2026-09-24 实测发现的地雷：**线上栈的 UserData 与模板已经不一致。**
#
# 本会话早期修过 02 的 UserData（口令被 `set -x` 打进日志那处包进
# `set +x`；镜像 tag 从编造的 1.29.0/2.42.0 改成真实存在的 1.29.7/2.54.1），
# 但当时是用 SSM 直接修活实例，**栈从未重新部署**。
#
# 于是现在对 02 做任何 deploy，变更集都会报：
#
# TemporalInstance  AWS::EC2::Instance  Modify  Replacement: Conditional
# Target: UserData   RequiresRecreation: Conditionally
#
# 而那台实例上跑着 Temporal 的 PostgreSQL 容器和 DR worker ——
# 被替换等于数据和服务一起没了。所以只要 UserData 的漂移没处理掉，
# 02 这个栈就不能碰。
#
# ## 这个栈怎么绕开
#
# `AWS::IAM::ManagedPolicy` 的 `Roles` 收的是角色**名字**，所以本栈可以
# 把策略挂到一个它并不拥有的角色上，完全不触碰 02 的任何资源。
# 删本栈只会摘掉这条策略。
#
# 这与「全局数据库用 CLI 而不是 CFN」是同一个判断：
# **不要让一个栈去处置不属于它的东西**，反过来也不要为了改一样东西
# 而让 CFN 有机会重建旁边那样东西。

Parameters:
  TemporalRoleName:
    Type: String
    Default: dr-korea-temporal-TemporalRole-MbW4WYmjoR8J
    Description: >
      02-temporal.yaml 建出来的实例角色名（实测取到的物理 ID，不是猜的）。
      换栈重建后这个名字会变，要重新取。

  PlanBucket:
    Type: String
    Default: dr-korea-agentcore-926093770964-ap-northeast-2
    Description: 计划正文所在的桶（与 temporal-mcp 代码包同桶，不同前缀）

  # 2026-10-05：GlobalClusterArn / PrimaryClusterArn / SecondaryClusterArn /
  # NodegroupArn 四个参数随两条写权限一起移除 —— 见下面「两条写权限已收回」。
  # 探针按名字读首尔资源，不需要这些 ARN。

Resources:

  WorkerReadPlans:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: DrKoreaWorkerReadPlans
      # ASCII only —— IAM 的 Description 不接受非 ASCII（本会话实测踩过）。
      Description: Read DR plan bodies from S3 for the Temporal DR worker
      Roles:
        - !Ref TemporalRoleName
      PolicyDocument:
        Version: '2012-10-17'
        Statement:

          # ── 为什么计划正文在 S3 而不在 workflow 里 ──────────────────
          #
          # 本服务端 workflowExecutionRetentionTtl = 720h（2026-10-05 实测；
          # 2026-09-26 重建前是 86400s）。即便 30 天，正文塞进 workflow 的
          # input 也会随历史一起被清掉，而灾备计划要活几个月。而且 payload 上限拿不到 ——
          # describe_namespace 的 namespaceInfo 里没有 limits 字段
          # （实测推翻了「查 blobSizeLimitError」这个假设）。
          #
          # 所以 workflow 只带引用，正文另存。
          - Sid: ReadDrPlanBodies
            Effect: Allow
            Action:
              - s3:GetObject
            # 只给 plans/ 前缀。同一个桶里另一个前缀放的是 temporal-mcp
            # 的可执行代码包 —— worker 没有任何理由读它，更没理由写。
            Resource: !Sub 'arn:aws:s3:::${PlanBucket}/plans/*'

          # ── 2026-09-24：worker 自己的代码也从 S3 取 ──────────────────
          #
          # 原来 /opt/dr-worker 是用 SSM 手工装的，不在 IaC 里。重启能保留，
          # 但**实例真被重建时它不会自动回来** —— 而 worker 不在时，切换
          # workflow 会一直排队并且**看起来是 RUNNING**（实测过），不报任何错。
          # 那是最糟的失效形态，所以 provisioning 必须进 IaC。
          #
          # 仍然只给读。worker 没有理由写自己的代码 —— 能写代码就等于
          # 能改变自己下一次启动后的行为。
          - Sid: ReadWorkerCode
            Effect: Allow
            Action:
              - s3:GetObject
            Resource: !Sub 'arn:aws:s3:::${PlanBucket}/worker/*'

          # ListBucket 是必需的，而且理由不是「方便」：
          #
          # 没有 ListBucket 时，HeadObject 对**不存在**的对象回 403 而不是
          # 404 —— 那会让「计划不存在」和「没有权限」两种状态在返回码上
          # 无法区分。本项目的立场是这类情况一律要能区分，否则
          # 排查的人只能猜。
          #
          # 限定 prefix 条件，避免顺带获得整桶的列举能力。
          - Sid: ListOnlyPlansPrefix
            Effect: Allow
            Action:
              - s3:ListBucket
            Resource: !Sub 'arn:aws:s3:::${PlanBucket}'
            Condition:
              StringLike:
                # 两个前缀都要列：plans/ 是计划正文，worker/ 是 worker 自己的
                # 代码（aws s3 sync 要先列出目录才知道下载什么）。
                's3:prefix':
                  - 'plans/*'
                  - 'worker/*'

          # ── ASG 生命周期读取 ────────────────────────────────────────────
          #
          # 为什么需要:缩容核实**不能看 EC2 的 State**。2026-09-24 实测:
          #
          #     ASG LifecycleState:  Terminating:Wait   ← 真相
          #     EC2 State:           running            ← 这一层分不出来
          #
          # 节点组的排空钩子 Terminate-LC-Hook 的 HeartbeatTimeout=1800
          # (30 分钟)、DefaultResult=CONTINUE,所以一台正在优雅排空的实例
          # 和一台缩容失败卡住的实例,在 EC2 那一层长得完全一样。
          #
          # ⚠️ 为什么 Resource 是 *:这不是放宽标准,是这个 action 的**硬约束**。
          # 服务授权参考(list_autoscaling.html 的 Actions 表)里
          # DescribeAutoScalingGroups 的「资源类型」列是**空的**,
          # 也没有任何 condition key —— 对比同页的 DeleteAutoScalingGroup
          # 是 autoScalingGroup*。空列意味着不支持资源级权限,只能写 *。
          #
          # 风险边界:它是 List 级、纯读,泄露的是本账号本 region 的 ASG 拓扑,
          # 不含凭据也不能改任何东西。
          - Sid: ReadAsgLifecycleState
            Effect: Allow
            Action:
              - autoscaling:DescribeAutoScalingGroups
            Resource: '*'

          # ── 2026-10-05：探针需要的三条只读 ──────────────────────────────
          #
          # 探针（probes.py）在缺权限时如实返回 UNKNOWN，演练会因此判
          # 「无法判断」—— 那是对的，但它会让演练永远过不了。这三条按资源收紧：
          #   dynamodb_table_active   只有宠物表
          #   ecr_image_present/tag   只有首尔的仓库
          #   lambda_function_active  只有 dr-korea-* 函数，且只读配置（不读代码包）
          - Sid: ProbeReadDynamoDbTable
            Effect: Allow
            Action:
              - dynamodb:DescribeTable
            Resource: !Sub 'arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/ServicesEks2-ddbpetadoption*'
          - Sid: ProbeReadEcrImages
            Effect: Allow
            Action:
              - ecr:DescribeImages
            Resource: !Sub 'arn:aws:ecr:${AWS::Region}:${AWS::AccountId}:repository/*'
          - Sid: ProbeReadLambdaConfig
            Effect: Allow
            Action:
              - lambda:GetFunctionConfiguration
            Resource: !Sub 'arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:dr-korea-*'

          # ── 2026-10-07：ARC Region switch 小验证 ─────────────────────────
          #
          # 唯一的写是 StartPlanExecution，而且只对 petsite-dr-poc 这一个计划。
          # 起执行不等于做变更：计划每个工作流第一步都是 ManualApproval，
          # 审批角色要求 MFA（20-arc-region-switch-poc.yaml，test_131 守着）。
          # **刻意不给** Approve / Cancel / UpdatePlanExecution(Step)：
          # 批准、取消、跳过失败步骤，都是人的决定。
          - Sid: ArcStartAndWatchPocPlan
            Effect: Allow
            Action:
              - arc-region-switch:StartPlanExecution
              - arc-region-switch:GetPlanExecution
              - arc-region-switch:ListPlanExecutionEvents
              - arc-region-switch:ListPlanExecutions
              - arc-region-switch:GetPlanInRegion
            Resource: !Sub 'arn:aws:arc-region-switch::${AWS::AccountId}:plan/petsite-dr-poc*'
          # 「谁批准的」从 CloudTrail 读（ARC 自己的事件里没有审批人）。
          # LookupEvents 不支持资源级权限，只读。
          - Sid: WhoApprovedFromCloudTrail
            Effect: Allow
            Action: cloudtrail:LookupEvents
            Resource: '*'

          # ── 2026-10-05：两条写权限已收回 ────────────────────────────────
          #
          # 这里原来有 ScaleUpPilotLightNodegroup（eks:UpdateNodegroupConfig）
          # 与 PromoteSecondaryCluster（rds:FailoverGlobalCluster）。
          #
          # 执行模型改成「人执行每个变更，Temporal 只核实」之后，worker 代码里
          # 已经没有任何写类 AWS 调用（test_128 用 AST 扫描守着）。但**代码不调用
          # 不等于角色不能调用** —— 一个仍持有 FailoverGlobalCluster 的角色，
          # 只要有人往 worker 里加一行，就能在没有任何人确认的情况下提升数据库。
          # 收回权限让「Temporal 不执行变更」从约定变成机制。
          #
          # 以后**不要**为了「方便」把它们加回来：要恢复自动执行，先回答谁来
          # 裁决「挂了还是不可达」—— 那是这套设计里唯一不能交给程序的判断。

Outputs:
  PolicyArn:
    Value: !Ref WorkerReadPlans

  VerifyCommand:
    Description: 核实用（与部署不同的手段：从实例上真读一次）
    Value: !Sub >
      aws ssm send-command --region ${AWS::Region} --instance-ids <id>
      --document-name AWS-RunShellScript
      --parameters 'commands=["aws s3 ls s3://${PlanBucket}/plans/ --region ${AWS::Region}"]'

  StillMissingForRealFailover:
    Description: 真切换还缺的写权限（刻意未给）
    Value: >
      eks:UpdateNodegroupConfig, rds:FailoverGlobalCluster,
      elasticloadbalancing:*, route53:ChangeResourceRecordSets
      —— 按步骤逐个放开；FailoverGlobalCluster 的有序 vs allow-data-loss
      必须是需 signal 放行的决策点
