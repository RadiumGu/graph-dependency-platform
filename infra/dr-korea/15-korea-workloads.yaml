  labels:
    aws.cdk.eks/prune-c83272d5df5b8246f49e8f35d6039967bf4431d63f: ''
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pethistory
  template:
    metadata:
      name: pethistory-deployment
      namespace: petadoptions
      labels:
        app: pethistory
      annotations:
        cloudwatch.aws.amazon.com/auto-annotate-dotnet: 'true'
        cloudwatch.aws.amazon.com/auto-annotate-java: 'true'
        cloudwatch.aws.amazon.com/auto-annotate-nodejs: 'true'
        cloudwatch.aws.amazon.com/auto-annotate-python: 'true'
        instrumentation.opentelemetry.io/inject-dotnet: 'true'
        instrumentation.opentelemetry.io/inject-java: 'true'
        instrumentation.opentelemetry.io/inject-nodejs: 'true'
        instrumentation.opentelemetry.io/inject-python: 'true'
        kubectl.kubernetes.io/restartedAt: '2026-09-05T03:36:20Z'
    spec:
      volumes:
      - name: otel-config
        configMap:
          name: otel-config
          defaultMode: 420
      containers:
      - name: pethistory
        image: 926093770964.dkr.ecr.ap-northeast-2.amazonaws.com/pet-adoptions-history:latest
        ports:
        - containerPort: 8080
          protocol: TCP
        env:
        - name: AWS_XRAY_DAEMON_ADDRESS
          value: xray-service.default:2000
        - name: AWS_REGION
          value: ap-northeast-2
        - name: OTEL_OTLP_ENDPOINT
          value: localhost:4317
        - name: OTEL_RESOURCE
          value: ClusterName=PetSite
        - name: OTEL_RESOURCE_ATTRIBUTES
          value: service.namespace=AWSObservability,service.name=PetAdoptionsHistory
        - name: S3_REGION
          value: ap-northeast-2
        - name: OTEL_METRICS_EXPORTER
          value: otlp
        resources:
          limits:
            cpu: 500m
            memory: 1Gi
          requests:
            cpu: 32m
            memory: 128Mi
        livenessProbe:
          httpGet:
            path: /health/status
            port: 8080
            scheme: HTTP
          initialDelaySeconds: 30
          timeoutSeconds: 1
          periodSeconds: 10
          successThreshold: 1
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health/status
            port: 8080
            scheme: HTTP
          initialDelaySeconds: 5
          timeoutSeconds: 3
          periodSeconds: 5
          successThreshold: 1
          failureThreshold: 2
        startupProbe:
          httpGet:
            path: /health/status
            port: 8080
            scheme: HTTP
          timeoutSeconds: 3
          periodSeconds: 5
          successThreshold: 1
          failureThreshold: 30
        terminationMessagePath: /dev/termination-log
        terminationMessagePolicy: File
        imagePullPolicy: Always
      - name: aws-otel-collector
        image: public.ecr.aws/aws-observability/aws-otel-collector:v0.47.0
        args:
        - --config=/etc/otel-config/otel-config.yaml
        env:
        - name: AWS_REGION
          value: ap-northeast-2
        - name: AOT_CONFIG_CONTENT
          value: "# aws-otel-collector sidecar 配置 —— 增加 DeepFlow OTLP exporter\n#\n# 为什么不是「给 DeepFlow 加 X-Amzn-Trace-Id 提取头」：\n# DeepFlow 只对 traceparent / sw8·sw6 / uber-trace-id 三个头做格式感知解析，\n# 其它自定义头整串读取。而\
            \ X-Amzn-Trace-Id 的值是\n#   Root=1-xxx;Parent=yyy;Sampled=1\n# Parent 每跳都不同 → 整串每跳不同 → trace_id 非 0 但无法把同一条链归到一起。\n# DeepFlow 文档也明确：分布式追踪只支持 eBPF 采集或经 OpenTelemetry 协议传入。\n#\n# ── 端点：用 Service，不用\
            \ hostIP ────────────────────────────────────────\n# 飞行前实测（2026-08-29）：deepflow-agent DaemonSet 的 hostNetwork=false，\n# 且 38086 **没有 hostPort** —— 所以 `${env:K8S_NODE_IP}:38086` 到不了 agent，\n\
            # 它只监听 Pod IP。正确端点是 Service：\n#   kubectl -n deepflow get svc deepflow-agent\n#     port=80  targetPort=receive(=38086)\n# 实测 POST http://deepflow-agent.deepflow:80/api/v1/otel/trace → HTTP\
            \ 200\n# 用 Service DNS 的额外好处：不需要注入 K8S_NODE_IP 环境变量，\n# 改动面只剩 AOT_CONFIG_CONTENT 一个字段。\n#\n# Service 会在 4 个 agent 间负载均衡，span 可能落到任意一个 —— 对 OTLP 摄入\n# 无影响（DeepFlow 对外部推送的 span 不要求节点亲和）。\n#\n\
            # ── 安全性质 ────────────────────────────────────────────────────────────\n# 两个 exporter 相互独立。即使 DeepFlow 端完全不可达，awsxray 仍照常导出，\n# retry_on_failure + sending_queue 会让失败批次重试后丢弃，不会反压。\n# 现有 X-Ray\
            \ 链路不承担风险。\nreceivers:\n  otlp:\n    protocols:\n      grpc:\n        endpoint: 0.0.0.0:4317\n      http:\n        endpoint: 0.0.0.0:4318\nprocessors:\n  batch/traces:\n    timeout: 1s\n   \
            \ send_batch_size: 50\nexporters:\n  awsxray:\n    region: ap-northeast-1\n  otlphttp/deepflow:\n    traces_endpoint: \"http://deepflow-agent.deepflow:80/api/v1/otel/trace\"\n    tls:\n    \
            \  insecure: true\n    retry_on_failure:\n      enabled: true\n      max_elapsed_time: 30s\n    sending_queue:\n      enabled: true\n      queue_size: 500\nservice:\n  pipelines:\n    traces:\n\
            \      receivers: [otlp]\n      processors: [batch/traces]\n      exporters: [awsxray, otlphttp/deepflow]\n"
        resources:
          limits:
            cpu: 256m
            memory: 512Mi
          requests:
            cpu: 32m
            memory: 24Mi
        volumeMounts:
        - name: otel-config
          mountPath: /etc/otel-config
        terminationMessagePath: /dev/termination-log
        terminationMessagePolicy: File
        imagePullPolicy: IfNotPresent
      restartPolicy: Always
      terminationGracePeriodSeconds: 30
      dnsPolicy: ClusterFirst
      serviceAccountName: pethistory-sa
      securityContext: {}
      schedulerName: default-scheduler
      topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: topology.kubernetes.io/zone
        whenUnsatisfiable: ScheduleAnyway
        labelSelector:
          matchLabels:
            app: pethistory
      - maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: ScheduleAnyway
        labelSelector:
          matchLabels:
            app: pethistory

