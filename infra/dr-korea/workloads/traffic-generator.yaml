# 服务 traffic-generator —— 由 scripts/split_korea_workloads.py 从 15-korea-workloads.yaml **逐字**切出。
# ⚠️ 不要手改：改 15 号文件（它本身由 scripts/gen_korea_workloads.py 生成），然后重跑拆分脚本。
# 切换计划里每个服务一步：单独 apply、单独核实、单独 delete 回滚。
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: traffic-generator-sa
  namespace: petadoptions
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::926093770964:role/ServicesEks2-trafficgeneratorServiceAccountRole1029-ZjtBnUIVOBI1

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: traffic-generator
  namespace: petadoptions
  labels:
    app: traffic-generator
    aws.cdk.eks/prune-c8f1a1f14fa123487fc25238ead109ffafa41e3daf: ''
spec:
  replicas: 1
  selector:
    matchLabels:
      app: traffic-generator
  template:
    metadata:
      name: traffic-generator
      namespace: petadoptions
      labels:
        app: traffic-generator
      annotations:
        cloudwatch.aws.amazon.com/auto-annotate-dotnet: 'true'
        cloudwatch.aws.amazon.com/auto-annotate-java: 'true'
        cloudwatch.aws.amazon.com/auto-annotate-nodejs: 'true'
        cloudwatch.aws.amazon.com/auto-annotate-python: 'true'
        instrumentation.opentelemetry.io/inject-dotnet: 'true'
        instrumentation.opentelemetry.io/inject-java: 'true'
        instrumentation.opentelemetry.io/inject-nodejs: 'true'
        instrumentation.opentelemetry.io/inject-python: 'true'
        kubectl.kubernetes.io/restartedAt: '2026-08-29T14:43:17Z'
    spec:
      containers:
      - name: traffic-generator
        image: 926093770964.dkr.ecr.ap-northeast-2.amazonaws.com/cdk-hnb659fds-container-assets-926093770964-ap-northeast-1:28111322a93d1fbacfdf11a76a1b8579f400c9d701351b6470404e567ae0bf89
        ports:
        - containerPort: 80
          protocol: TCP
        env:
        - name: AWS_REGION
          value: ap-northeast-2
        - name: TRAFFIC_GENERATOR_HEADER
          value: X-Traffic-Generator:petsite-chaos-0c9027fb05beab77
        - name: petsiteurl
          value: http://service-petsite.petadoptions.svc.cluster.local
        - name: searchapiurl
          value: http://search-service.petadoptions.svc.cluster.local/api/search?
        resources:
          limits:
            cpu: 64m
            memory: 512Mi
          requests:
            cpu: 64m
            memory: 512Mi
        terminationMessagePath: /dev/termination-log
        terminationMessagePolicy: File
        imagePullPolicy: IfNotPresent
      restartPolicy: Always
      terminationGracePeriodSeconds: 30
      dnsPolicy: ClusterFirst
      serviceAccountName: traffic-generator-sa
      securityContext: {}
      schedulerName: default-scheduler
      enableServiceLinks: false

---
apiVersion: v1
kind: Service
metadata:
  name: traffic-generator
  namespace: petadoptions
  labels:
    aws.cdk.eks/prune-c82718d2549ef81bf356ab12aef7ef76abb10803a3: ''
  annotations:
    service.kubernetes.io/topology-mode: auto
spec:
  type: ClusterIP
  selector:
    app: traffic-generator
  ports:
  - port: 80
    protocol: TCP
    targetPort: 80
